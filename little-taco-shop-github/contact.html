<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact The Little Taco Shop.">
  <title>Contact LTS</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <h1>🌮 Contact The Little Taco Shop</h1>
    <nav aria-label="Primary navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#about">About <abbr title="The Little Taco Shop">LTS</abbr></a></li>
        <li><a href="index.html#menu">Our Menu</a></li>
        <li><a href="hours.html">Store Hours</a></li>
      </ul>
    </nav>
    <figure class="hero">
      <img src="images/taco-shop.svg" alt="Illustration of tacos" width="1000" height="500">
      <figcaption>We'd love to hear from you.</figcaption>
    </figure>
  </header>

  <main>
    <article>
      <h2>Our Contact Form</h2>
      <form action="https://httpbin.org/post" method="post">
        <fieldset>
          <legend>Send Us A Message</legend>
          <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Your name" autocomplete="name" required>
          </p>
          <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
          </p>
          <p>
            <label for="message">Your Message:</label><br>
            <textarea id="message" name="message" rows="8" cols="40" placeholder="Type your message here..." required></textarea>
          </p>
        </fieldset>
        <button type="submit">Send</button>
        <button type="reset">Reset</button>
      </form>
    </article>

    <article>
      <h2>Our Location</h2>
      <address>
        123 Taco Street<br>
        Taco Town, TX 75001<br>
        Phone: <a href="tel:+15555550123">(555) 555-0123</a>
      </address>
    </article>

    <p><a href="#">Back to Top</a></p>
  </main>

  <footer>
    <p>Copyright &copy; 2026 The Little Taco Shop</p>
  </footer>
</body>
</html>
